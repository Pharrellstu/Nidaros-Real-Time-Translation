<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Stream with Player Controls (JW Player)</title>

    <script src="https://cdn.jwplayer.com/libraries/KVS6Czgx.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 10px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 2rem;
            text-align: center;
            margin-bottom: 20px;
        }

        .video-container {
            width: 100%;
            max-width: 960px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
        }

        #subtitle-display {
            margin-top: 20px;
            padding: 15px;
            background-color: #1e1e1e;
            border-radius: 8px;
            width: 100%;
            max-width: 960px;
            min-height: 50px;
            text-align: center;
            font-size: 1.2rem;
            color: #ffffff;
            border: 1px solid #333;
            box-sizing: border-box;
        }

        .status-dot {
            height: 12px;
            width: 12px;
            background-color: #bbb;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }

        #connection-status {
            margin-top: 10px;
            font-size: 0.9em;
            color: #aaa;
            text-align: center;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.4rem;
                margin-bottom: 10px;
            }

            #subtitle-display {
                font-size: 1rem;
                padding: 10px;
                min-height: 40px;
            }

            .video-container {
                border-radius: 6px;
            }

            #connection-status {
                font-size: 0.8rem;
            }

            .jw-icon {
                width: 36px !important;
                height: 36px !important;
            }
        }

        @media (orientation: landscape) and (max-height: 450px) {
            #subtitle-display {
                font-size: 0.9rem;
                padding: 6px;
                min-height: 35px;
            }
        }
    </style>
</head>

<body>

<h1>Live Stream Player (Custom Controls)</h1>

<div class="video-container">
    <div id="jw-live-player"></div>
</div>

<div id="subtitle-display">
    Waiting for stream to load...
</div>

<div id="connection-status">
    <span id="status-indicator" class="status-dot connected"></span>
    <span>Attempting to connect to stream.</span>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {

        const statusIndicator = document.getElementById('status-indicator');
        const connectionStatusText = document.getElementById('connection-status').children[1];
        const subtitleDisplayText = document.getElementById('subtitle-display');

        const player = jwplayer('jw-live-player').setup({
            file: "http://localhost:1935/whisper/myStream_delayed/playlist.m3u8",
            isLive: true,
            preload: 'auto',
            width: '100%',
            height: '100%',
            aspectratio: "16:9",
            controls: true,
            renderCaptionsNatively: false
        });

        player.on('ready', () => {
            player.play();

            setupCustomCCButton();
            setupCustomQualityButton();
            applyInitialCaptionStyle();

            statusIndicator.className = 'status-dot connected';
            connectionStatusText.textContent = 'Stream connected. Checking for captions...';

            player.on('captionsList', checkCaptionAvailability);

            player.on('error', (event) => {
                statusIndicator.className = 'status-dot disconnected';
                connectionStatusText.textContent = `Stream Error: ${event.message}`;
                subtitleDisplayText.textContent = `CRITICAL ERROR: Stream failed to load. Check HLS URL.`;
            });
        });

        function setupCustomCCButton() {
            const ccIconSvg = '<svg fill="#FFFFFF" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M0 0h24v24H0z" fill="none"/><path d="M19 8H5c-1.1 0-1.99.9-1.99 2L3 18c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-8c0-1.1-.9-2-2-2zm-2 6H7v-2h10v2zm-4 4H7v-2h6v2z"/></svg>';

            player.addButton(
                ccIconSvg,
                'Toggle Captions',
                togglePlayerCaptions,
                'cc-toggle-button'
            );
        }

        function togglePlayerCaptions() {
            const currentTrackIndex = player.getCurrentCaptions();
            const tracks = player.getCaptionsList();

            if (tracks.length <= 1) {
                subtitleDisplayText.textContent = 'Error: No caption tracks detected in the stream.';
                return;
            }

            if (currentTrackIndex === 0) {
                player.setCurrentCaptions(1);
                subtitleDisplayText.textContent = `Captions ON: Showing ${tracks[1].label} track.`;
            } else {
                player.setCurrentCaptions(0);
                subtitleDisplayText.textContent = 'Captions OFF.';
            }
        }

        function setupCustomQualityButton() {
            const settingsIconSvg = '<svg fill="#FFFFFF" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M0 0h24v24H0z" fill="none"/><path d="M12 8c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3zm0 2c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3zm0 8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>';

            player.addButton(
                settingsIconSvg,
                'Cycle Quality',
                cyclePlayerQuality,
                'quality-toggle-button'
            );
        }

        function cyclePlayerQuality() {
            const levels = player.getQualityLevels();

            if (!levels || levels.length <= 1) {
                subtitleDisplayText.textContent = 'Only one stream quality level is available.';
                return;
            }

            const currentIndex = player.getCurrentQuality();
            const totalChoices = levels.length;
            const nextIndex = (currentIndex + 1) % totalChoices;

            player.setCurrentQuality(nextIndex);

            const nextLevelLabel = (nextIndex === 0) ? 'Auto' : levels[nextIndex].label;

            subtitleDisplayText.textContent = `Quality set to: ${nextLevelLabel}`;
        }

        function applyInitialCaptionStyle() {
            const defaultSize = localStorage.getItem('subtitleSize') || '150%';
            player.setCaptions({ 'fontScale': defaultSize });
        }

        function checkCaptionAvailability() {
            const tracks = player.getCaptionsList();

            if (tracks.length > 1) {
                subtitleDisplayText.textContent = `Stream loaded with ${tracks.length - 1} caption track(s).`;
            } else {
                subtitleDisplayText.textContent = 'Stream loaded, but no caption tracks found.';
            }
        }
    });
</script>

</body>

</html>
