<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wowza Live Captions</title>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        :root {
            color-scheme: dark;
            font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #0d1117;
            color: #e6edf3;
            padding: 24px;
        }

        main {
            width: min(960px, 100%);
            display: grid;
            gap: 16px;
        }

    </style>
</head>
<body>
    <main>
            <video-js id="live-video" class="vjs-default-skin" controls preload="auto" playsinline
                      width="960" height="540" crossorigin="anonymous" data-setup='{"liveui": true}'>
                <source src="http://localhost:1935/live/OBSstream/playlist.m3u8" type="application/x-mpegURL">
                <p>Your browser needs HTML5 video to view this stream.</p>
            </video-js>
    </main>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script>
        const player = videojs('live-video');
        player.ready(() => {
            player.play().catch(err => console.warn('Autoplay was blocked:', err));
        });
        player.on('error', () => console.error('Video.js error:', player.error()));
    </script>
</body>
</html>
