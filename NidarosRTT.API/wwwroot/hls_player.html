<!DOCTYPE html>
<html>
<head>
  <!-- ... other head elements ... -->
  <script>
    // Change this URL in your .env file and update it here
    const HLS_STREAM_URL = 'http://wse-trial.wowza.com:1935/wowzaApp/CPHTD/playlist.m3u8';
  </script>
</head>
<body>
  <video id="video" controls autoplay></video>
  
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const video = document.getElementById('video');
      console.log('Using stream URL:', HLS_STREAM_URL);
      
      if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(HLS_STREAM_URL);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
      }
    });
  </script>
</body>
</html>
