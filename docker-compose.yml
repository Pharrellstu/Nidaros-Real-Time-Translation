version: '3.8'

services:
  # The Whisper Transcription Service (Python/FastAPI)
  whisper-service:
    build:
      context: ./WhisperService # Path to the WhisperService directory
      dockerfile: Dockerfile
    # No need to expose ports to the host if only other containers need it
    # ports:
    #   - "5001:5001"
    restart: unless-stopped

  # The main .NET API
  api-service:
    build:
      context: . # The root directory of your solution
      dockerfile: NidarosRTT.API/Dockerfile
    ports:
      - "5032:5032"
    environment:
      # Use the service name 'whisper-service' for communication inside Docker
      - WHISPER_URL=http://whisper-service:5001/transcribe
      - STREAM_URL=rtsp://host.docker.internal:1935/live/OBSstream
      # The rest of your environment variables
      - ASPNETCORE_URLS=http://+:5032
      - FFMPEG_PATH=/usr/bin/ffmpeg
    depends_on:
      - whisper-service
    restart: unless-stopped

  # Wowza Streaming Engine Trial
  wowza-trial:
    hostname: wse.docker
    image: wowza/wowza-streaming-engine:latest-trial
    environment:
      - WSE_LICENSE_KEY=${WSE_LICENSE_KEY}
      - ADMIN_USER=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - IPWHITELIST=*
      - TRANSCODER=disabled
      - LOG_LEVEL=WARN
      - SIMU_LIVE=enabled
    ports:
      - "80:80"
      - "443:443"
      - "1935:1935"
      - "8087:8087"
      - "6970-6999:6970-6999/udp"
      - "10000:10000/udp"
    restart: unless-stopped

  # Wowza Streaming Engine Manager
  wowza-manager:
    hostname: wsem.docker
    image: wowza/wowza-streaming-engine-manager:latest
    environment:
      - LOG_LEVEL=WARN
      - WSE_HOST=http://wse.docker:8087
    ports:
      - "8088:8080"
    depends_on:
      - wowza-trial
    restart: unless-stopped