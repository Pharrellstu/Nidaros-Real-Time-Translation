version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: NidarosRTT.API/Dockerfile
    ports:
      - "5000:80"
      - "1935:1935"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENV:-Production}
      - RTMP_STREAM_URL=${RTMP_STREAM_URL}
      - HLS_STREAM_URL=${HLS_STREAM_URL}
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_HTTP_PORTS=5000
      - ASPNETCORE_HTTPS_PORTS=5001
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - ASPNETCORE_Kestrel__Endpoints__Http__Url=http://0.0.0.0:80
      - CORS_ALLOWED_ORIGINS=*
    volumes:
      - ./NidarosRTT.API/wwwroot/hls:/app/wwwroot/hls
      - ./NidarosRTT.API/wwwroot/output:/app/wwwroot/output
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
