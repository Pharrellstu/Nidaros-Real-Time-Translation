version: '3.8'

name: Nidaros Real-Time Translation

services:
  # Wowza Streaming Engine
  wowza-trial:
    hostname: wse.docker
    image: wowza/wowza-streaming-engine:latest-trial
    environment:
      - WSE_LICENSE_KEY=${WSE_LICENSE_KEY}
      - ADMIN_USER=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - IPWHITELIST=*
      - TRANSCODER=disabled
      - LOG_LEVEL=WARN
      - SIMU_LIVE=enabled
    # volumes:
    #   - ./wse/applications:/usr/local/WowzaStreamingEngine/applications
    #   - ./wse/conf:/usr/local/WowzaStreamingEngine/conf
    #   - ./wse/content:/usr/local/WowzaStreamingEngine/content
    #   - ./wse/transcoder:/usr/local/WowzaStreamingEngine/transcoder
    ports:
      - 80:80
      - 443:443
      - 1935:1935
      - 8087:8087
      - 6970-6999:6970-6999/udp
      - 10000:10000/udp
    restart: unless-stopped

  wowza-manager:
    hostname: wsem.docker
    image: wowza/wowza-streaming-engine-manager:latest
    environment:
      - LOG_LEVEL=WARN
      - WSE_HOST=http://wse.docker:8087
    ports:
      - 8088:8080
    restart: unless-stopped

  # Audio transcription services
  whisper:
    build:
      context: ./NidarosRTT.API/Services/whisper-service
      dockerfile: Dockerfile
    volumes:
      - ./AudioCapture/output:/data
    restart: unless-stopped

  audio-capture:
    build:
      context: ./NidarosRTT.API/Services/AudioCapture
      dockerfile: Dockerfile
    volumes:
      - ./AudioCapture/output:/app/output
    environment:
      - RTMP_STREAM_URL=${RTMP_STREAM_URL:-rtmp://172.20.160.1:1935/Test01/_definst_/myStream}
      - HLS_STREAM_URL=${HLS_STREAM_URL:-http://172.20.160.1:1935/Test01/_definst_/myStream/playlist.m3u8}
    network_mode: "host"
    command: ["--mode", "continuous", "--duration", "5", "--max-segments", "10"]
    restart: unless-stopped