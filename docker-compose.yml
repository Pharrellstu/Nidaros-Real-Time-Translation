version: '3.8'

services:
  # The Whisper Transcription Service (Python/FastAPI)
  whisper-service:
    build:
      context: ./WhisperService # Path to the WhisperService directory
      dockerfile: Dockerfile
    # No need to expose ports to the host if only other containers need it
    # ports:
    #   - "5001:5001"
    restart: unless-stopped

  # The main .NET API
  api-service:
    build:
      context: . # The root directory of your solution
      dockerfile: NidarosRTT.API/Dockerfile
    ports:
      - "5032:5032"
    environment:
      # Use the service name 'whisper-service' for communication inside Docker
      - WHISPER_URL=http://whisper-service:5001/transcribe
      - STREAM_URL=rtsp://host.docker.internal:1935/live/OBSstream
      # The rest of your environment variables
      - ASPNETCORE_URLS=http://+:5032
      - FFMPEG_PATH=/usr/bin/ffmpeg
    depends_on:
      - whisper-service # Ensures the whisper service starts first
    restart: unless-stopped