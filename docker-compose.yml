version: '3.8'

services:
  # Argos Translator Service (Python Flask)
  # DISABLED FOR NOW - Using English-only mode
  # To re-enable: uncomment this entire section and update depends_on in other services
  # translator-service:
  #   build:
  #     context: ./TranslatorService
  #     dockerfile: Dockerfile
  #   ports:
  #     - "5000:5000"
  #   restart: unless-stopped

  # Faster-Whisper Transcription Service (Python/FastAPI)
  whisper-service:
    build:
      context: ./FasterWhisperService
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - MODEL_NAME=small.en  # English-only model for better accuracy
      - DEVICE=cpu           # Change to "cuda" if you have NVIDIA GPU
      - COMPUTE_TYPE=int8    # Use "float16" with GPU
      # Translation disabled - keeping variable for future use
      # - TRANSLATION_SERVICE_URL=http://translator-service:5000/translate
    # Removed depends_on translator-service since it's disabled
    restart: unless-stopped

  # The main .NET API
  api-service:
    build:
      context: . # The root directory of your solution
      dockerfile: NidarosRTT.API/Dockerfile
    ports:
      - "5032:5032"
    environment:
      # Use the service name 'whisper-service' for communication inside Docker
      - WHISPER_URL=http://whisper-service:5001/transcribe
      # Translator disabled - keeping variable for future use
      # - TRANSLATOR_URL=http://translator-service:5000
      - STREAM_URL=rtsp://wowza-trial:1935/live/OBSstream
      - STREAM_NAME=OBSstream
      - VTT_OUTPUT_PATH=/shared_content/vtt
      # The rest of your environment variables
      - ASPNETCORE_URLS=http://+:5032
      - FFMPEG_PATH=/usr/bin/ffmpeg
    volumes:
      - shared_content:/shared_content
    depends_on:
      - whisper-service
      # Removed translator-service dependency since it's disabled
    restart: unless-stopped

  # Wowza Streaming Engine Trial
  wowza-trial:
    hostname: wse.docker
    image: wowza/wowza-streaming-engine:latest-trial
    environment:
      - WSE_LICENSE_KEY=${WSE_LICENSE_KEY}
      - ADMIN_USER=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - IPWHITELIST=*
      - TRANSCODER=disabled
      - LOG_LEVEL=WARN
      - SIMU_LIVE=enabled
    ports:
      - "80:80"
      - "443:443"
      - "1935:1935"
      - "8087:8087"
      - "6970-6999:6970-6999/udp"
      - "10000:10000/udp"
    volumes:
      - shared_content:/usr/local/WowzaStreamingEngine/content
    restart: unless-stopped

  # Wowza Streaming Engine Manager
  wowza-manager:
    hostname: wsem.docker
    image: wowza/wowza-streaming-engine-manager:latest
    environment:
      - LOG_LEVEL=WARN
      - WSE_HOST=http://wse.docker:8087
    ports:
      - "8088:8080"
    depends_on:
      - wowza-trial
    restart: unless-stopped

# Shared volume for VTT files between api-service and wowza-trial
volumes:
  shared_content:
    driver: local
